[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transitometer"
version = "0.1.0"
description = "Streaming + lakehouse data-engineering platform for urban transit reliability measurement (CO5173)."
readme = "README.md"
# The Spark container ships Python 3.10, so project code must stay 3.10-compatible.
requires-python = ">=3.10"
dependencies = [
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    "gtfs-realtime-bindings==3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
]
# The Streamlit app, pinned to the Spark image (docker/spark-tools/requirements.lock). The hosted
# app installs the same pins from src/transitometer/app/requirements.txt (kept equal by a test).
app = [
    "streamlit==1.64.0",
    "pandas==2.3.3",
    "altair==6.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transitometer = ["golden/sql/*.sql", "golden/queries/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "tasks.py"]

[[tool.mypy.overrides]]
# No type information shipped (pyarrow, GTFS-RT bindings) or container-only packages
# (pyspark, streamlit, confluent_kafka are installed in the Spark image, not the host venv).
module = [
    "pyarrow",
    "pyarrow.*",
    "google.transit",
    "google.transit.*",
    "pyspark",
    "pyspark.*",
    "streamlit",
    "altair",
    "pandas",
    "confluent_kafka",
    "confluent_kafka.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Streamlit and Altair ship type information, but only some environments install them (the app
# extra). Treat them as untyped everywhere so mypy gives the same result with or without them.
module = ["streamlit", "streamlit.*", "altair", "altair.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
