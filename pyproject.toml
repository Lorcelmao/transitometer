[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transitometer"
version = "0.1.0"
description = "Streaming + lakehouse data-engineering platform for urban transit reliability measurement (CO5173)."
readme = "README.md"
# The Spark container ships Python 3.10, so project code must stay 3.10-compatible.
requires-python = ">=3.10"
dependencies = [
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "tasks.py"]

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
