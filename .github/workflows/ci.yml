# G1 (fast, every PR) + compose validation. Engine integration (G2) is added from S2 onward.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 = Python inside the Spark image; 3.12 = host development interpreter.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python tasks.py check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tasks.py compose-config

  # The hosted Streamlit app, as Streamlit Community Cloud runs it: only the hosted requirements,
  # the package imported from the clone (not installed), no data root, Docker or lakehouse.
  # Renders every page on the committed snapshot and the golden tables.
  hosted-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r src/transitometer/app/requirements.txt pytest==9.1.1
      - run: python -m pytest tests/test_app_pages.py tests/test_hosting.py
        env:
          PYTHONPATH: src

  # The Next.js showcase (web/): lint, types, unit tests, static export, end-to-end tests
  # (cross-frontend parity, accessibility, keyboard, CSP) and Lighthouse budgets.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - run: npm run lhci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          retention-days: 7
